name: Gitleaks Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:

# Sem `pull-requests: write` o gitleaks-action falha em todo PR — não por leak,
# mas porque o token padrão não pode listar os commits do PR (`GET /pulls/N/commits`
# responde 403 "Resource not accessible by integration"). Um portão que quebra por
# configuração é pior que nenhum portão: o X vermelho passa a significar qualquer
# coisa, e o primeiro instinto é ignorá-lo.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
