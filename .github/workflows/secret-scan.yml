name: Gitleaks Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
  # O trabalho abaixo existe por um motivo concreto: um secret de 43 caracteres
  # entrou no commit fe394eb e nem o gitleaks de fábrica nem o scan de push viram
  # — o scan de push só olha os commits novos, e o valor estava solto dentro de
  # um arquivo de teste. Uma vez no histórico, ele fica público para todo clone,
  # então a checagem da história inteira precisa se repetir sozinha.
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

# Sem `pull-requests: write` o gitleaks-action falha em todo PR — não por leak,
# mas porque o token padrão não pode listar os commits do PR (`GET /pulls/N/commits`
# responde 403 "Resource not accessible by integration"). Um portão que quebra por
# configuração é pior que nenhum portão: o X vermelho passa a significar qualquer
# coisa, e o primeiro instinto é ignorá-lo.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  historico:
    name: Varredura do histórico inteiro
    # Só em agendamento e disparo manual: o job acima já pega cada PR, e uma
    # varredura dos 79 commits a cada push seria custo sem ganho.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com a história toda
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Versão fechada e igual à usada nesta máquina para escrever as regras
      # (8.30.1): sem pinar, a imagem `latest` pode acordar com outra biblioteca
      # de regras e o resultado do scan muda sem ninguém ter mexido em nada.
      - name: gitleaks --log-opts=--all
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml \
                   --log-opts=--all --no-banner --redact --exit-code 1
